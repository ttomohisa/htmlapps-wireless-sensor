name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "app.config.json"
      - "dependencies.json"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test headers, sensor coordinates and Undo
        run: node --test tests/*.test.cjs

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Check release eligibility (read-only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify-release-state-v103.ps1 -DryRun

      - name: Build and inspect v1.0.3 release candidates
        shell: pwsh
        run: |
          ./scripts/package-release-v103.ps1

      - name: Upload v1.0.3 release candidate
        uses: actions/upload-artifact@v7
        with:
          name: v103-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-out/htmlapps-wireless-sensor-v1.0.3.html
            release-out/htmlapps-wireless-sensor-v1.0.3.self-extract.html
            release-out/htmlapps-wireless-sensor-v1.0.3.zip
            release-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14
